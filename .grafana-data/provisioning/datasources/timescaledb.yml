apiVersion: 1

datasources:
  - name: TimescaleDB
    type: postgres
    url: localhost:5432
    database: kimp_station
    user: kimp_user
    secureJsonData:
      password: kimp_password
    jsonData:
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1400
      timescaledb: true
    isDefault: true
    editable: true
